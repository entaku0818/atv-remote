name: ATVRemote
options:
  bundleIdPrefix: com.entaku
  developmentLanguage: ja
  deploymentTarget:
    iOS: "17.0"
packages:
  ATVRemoteKit:
    path: ../../ATVRemoteKit
targets:
  ATVRemote:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: ATVRemoteKit
        product: ATVRemoteKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.entaku.atvremote
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Android TVを検索・操作するためにローカルネットワークを使用します。
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ポケットリモコン
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        NSLocalNetworkUsageDescription: Android TVを検索・操作するためにローカルネットワークを使用します。
        NSBonjourServices:
          - _androidtvremote2._tcp
        UILaunchScreen: {}
  ATVRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: ATVRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.entaku.atvremote.tests
  ATVRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: ATVRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.entaku.atvremote.uitests
schemes:
  ATVRemote:
    build:
      targets:
        ATVRemote: all
    test:
      targets:
        - ATVRemoteTests
        - ATVRemoteUITests
      gatherCoverageData: true
    archive:
      config: Release
