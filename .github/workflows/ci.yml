name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  swiftlint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/realm/swiftlint:latest
    steps:
      - uses: actions/checkout@v4
      - name: Run SwiftLint
        run: swiftlint lint

  swift-package:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ATVRemoteKit
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ATVRemoteKit/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('ATVRemoteKit/Package.resolved') }}
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Unit test atvremotekit
        run: ./gradlew :atvremotekit:test
      - name: Compile cli
        run: ./gradlew :cli:compileKotlin
      - name: Lint app
        run: ./gradlew :app:lintDebug
      - name: Assemble app
        run: ./gradlew :app:assembleDebug
