name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint lint

  swift-package:
    runs-on: macos-14
    defaults:
      run:
        working-directory: ATVRemoteKit
    steps:
      - uses: actions/checkout@v4
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ATVRemoteKit/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('ATVRemoteKit/Package.resolved') }}
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  ios-app:
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios/ATVRemote
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project ATVRemote.xcodeproj \
            -scheme ATVRemote \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
